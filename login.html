<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Saathi</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <span>Campus</span>Saathi
            </div>

            <p class="auth-tagline">
                Your smarter student companion
            </p>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue to Campus Saathi.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Login JavaScript -->

    <script src="login.js"></script>

</body>
</html>
